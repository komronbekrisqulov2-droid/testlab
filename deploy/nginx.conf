# ==========================================================
#  TestLab — Nginx Reverse Proxy (Mini App & Webhook)
# ==========================================================

# 1. HTTP -> HTTPS avtomatik yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name testlab.example.com; # O'z domeningizni yozing

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS server (Telegram Mini App talab qiladi)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testlab.example.com; # O'z domeningizni yozing

    # SSL sertifikatlari (masalan, Let's Encrypt / Certbot orqali olingan)
    ssl_certificate /etc/letsencrypt/live/testlab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testlab.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Katta fayllar (albomlar, rasmlar, Excel hisobotlar) yuklash uchun limit
    client_max_body_size 50M;

    # Mini App va API so'rovlarini botning aiohttp serveriga (8088) yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket yoki doimiy ulanishlar uchun
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Vaqt limitlari
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
