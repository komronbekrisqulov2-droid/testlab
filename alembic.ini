# ==========================================================
#  TestLab — Alembic konfiguratsiyasi
#
#  Buyruqlar:
#     alembic upgrade head                      oxirgi versiyaga
#     alembic downgrade -1                      bir qadam orqaga
#     alembic current                           hozirgi versiya
#     alembic history --verbose                 tarix
#     alembic check                             model ↔ baza farqi
#     alembic revision --autogenerate -m "izoh" yangi migratsiya
#     alembic stamp head                        mavjud bazani nazoratga olish
#
#  DIQQAT: baza manzili shu fayldan EMAS, `.env` dagi DATABASE_URL dan
#  olinadi (`migrations/env.py` ga qarang). Shuning uchun sirlar git'ga
#  tushmaydi va bot bilan alembic doim BIR XIL bazaga ishlaydi.
# ==========================================================

[alembic]

script_location = migrations
version_locations = %(here)s/migrations/versions
version_path_separator = os

#  Fayl nomi: 0001_initial_schema.py ko'rinishida
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

#  Loyiha ildizini import yo'liga qo'shadi
prepend_sys_path = .

output_encoding = utf-8

#  `timezone` ATAYLAB yozilmagan: u faqat migratsiya faylining
#  sarlavhasidagi sanaga ta'sir qiladi, lekin Windows'da qo'shimcha
#  `tzdata` paketini talab qiladi va usiz "Can't locate timezone"
#  xatosi bilan to'xtaydi. Bazadagi vaqtlar baribir UTC'da.

#  URL ataylab bo'sh — haqiqiy qiymat migrations/env.py da o'rnatiladi
sqlalchemy.url =


[post_write_hooks]
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# ==========================================================
#  LOGGING
# ==========================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
